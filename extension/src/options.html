<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width">
  <title>Chrome MCP settings</title>
  <style>
    body{font:15px system-ui;max-width:720px;margin:40px auto;padding:0 20px}
    label{display:block;margin:18px 0 6px}
    input{box-sizing:border-box;width:100%;padding:9px}
    button{margin-top:22px;padding:9px 18px}
    .note{color:#555;line-height:1.45}
    #saved{margin-left:12px}
  </style>
</head>
<body>
  <h1>Chrome MCP connection</h1>
  <p class="note">By default Unified MCP listens on loopback only. Point the extension at the local WebSocket bridge.</p>
  <form id="settings">
    <label for="serverUrl">Bridge WebSocket URL</label>
    <input id="serverUrl" required placeholder="ws://127.0.0.1:18766/bridge">
    <label for="browserId">Browser ID</label>
    <input id="browserId" required pattern="[A-Za-z0-9._-]{1,128}">
    <label for="browserName">Browser name</label>
    <input id="browserName" required>
    <button type="submit">Save and reconnect</button>
    <span id="saved"></span>
  </form>
  <script src="options.js" type="module"></script>
</body>
</html>
